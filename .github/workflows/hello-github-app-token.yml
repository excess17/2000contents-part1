name: Hello World - GitHub App Token

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App installation token (short-lived)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: excess17
          repositories: 2000contents-part1

      - name: Checkout target repo using the App token
        uses: actions/checkout@v4
        with:
          repository: excess17/2000contents-part1
          token: ${{ steps.app-token.outputs.token }}
          path: target
          persist-credentials: true

      - name: Create a Hello World commit on a new branch
        run: |
          set -euo pipefail
          BRANCH="hello/app-token-${{ github.run_id }}"

          cd target
          git checkout -b "$BRANCH"

          {
            echo "Hello from a GitHub App installation token!"
            echo "Repo: excess17/2000contents-part1"
            echo "Run ID: ${{ github.run_id }}"
            echo "Timestamp (UTC): $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > hello-from-github-app.txt

          git config user.name "excess17-app-bot"
          git config user.email "excess17-app-bot@users.noreply.github.com"

          git add hello-from-github-app.txt
          git commit -m "Hello World: commit via GitHub App token"
          git push origin "$BRANCH"

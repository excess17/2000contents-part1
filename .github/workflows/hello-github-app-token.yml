name: Hello World - GitHub App Token

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App installation token (short-lived)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: excess17
          repositories: 2000contents-part1

      - name: Checkout target repo using the App token
        uses: actions/checkout@v4
        with:
          repository: excess17/2000contents-part1
          token: ${{ steps.app-token.outputs.token }}
          path: target
          # Keep credentials available for Git operations (even so, we still set remote explicitly below)
          persist-credentials: true

      - name: Create a Hello World commit on a new branch
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Mask token so it won't appear in logs
          echo "::add-mask::${GH_APP_TOKEN}"

          BRANCH="hello/app-token-${{ github.run_id }}"

          cd target
          git checkout -b "$BRANCH"

          {
            echo "Hello from a GitHub App installation token!"
            echo "Repo: excess17/2000contents-part1"
            echo "Run ID: ${{ github.run_id }}"
            echo "Timestamp (UTC): $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > hello-from-github-app.txt

          git config user.name "excess17-app-bot"
          git config user.email "excess17-app-bot@users.noreply.github.com"

          git add hello-from-github-app.txt
          git commit -m "Hello World: commit via GitHub App token"

          # Ensure pushes authenticate using the short-lived GitHub App token
          git remote set-url origin "https://x-access-token:${GH_APP_TOKEN}@github.com/excess17/2000contents-part1.git"
          git push origin "$BRANCH"
